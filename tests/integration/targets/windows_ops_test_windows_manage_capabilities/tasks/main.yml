---
- name: Test windows_manage_capabilities
  block:
    - name: Capture original state of the test capability
      ansible.windows.win_capability:
        name: "{{ windows_manage_capabilities__test_name }}"
        state: present
      check_mode: true
      register: windows_manage_capabilities__original

    - name: Record whether the capability was originally installed
      ansible.builtin.set_fact:
        windows_manage_capabilities__was_present: "{{ not windows_manage_capabilities__original.changed }}"

    # -- State A: ensure the capability is installed --
    - name: Install the test capability via the role
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_capabilities
      vars:
        windows_manage_capabilities_install:
          - "{{ windows_manage_capabilities__test_name }}"
        windows_manage_capabilities_reboot: false

    - name: Verify the capability is installed
      ansible.windows.win_capability:
        name: "{{ windows_manage_capabilities__test_name }}"
        state: present
      check_mode: true
      register: windows_manage_capabilities__verify_present

    - name: Assert the capability is present
      ansible.builtin.assert:
        that:
          - not windows_manage_capabilities__verify_present.changed
        fail_msg: "Capability {{ windows_manage_capabilities__test_name }} was not installed"
        quiet: true

    # -- Idempotency --
    - name: Re-run install to verify idempotency
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_capabilities
      vars:
        windows_manage_capabilities_install:
          - "{{ windows_manage_capabilities__test_name }}"
        windows_manage_capabilities_reboot: false

    - name: Verify the capability is still present after idempotent re-run
      ansible.windows.win_capability:
        name: "{{ windows_manage_capabilities__test_name }}"
        state: present
      check_mode: true
      register: windows_manage_capabilities__verify_idempotent

    - name: Assert the capability is still present (idempotent)
      ansible.builtin.assert:
        that:
          - not windows_manage_capabilities__verify_idempotent.changed
        fail_msg: "Role is not idempotent for capability install"
        quiet: true

  always:
    - name: Restore the capability to its original state (remove if it was not present)
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_capabilities
      vars:
        windows_manage_capabilities_remove:
          - "{{ windows_manage_capabilities__test_name }}"
        windows_manage_capabilities_reboot: false
      when: not windows_manage_capabilities__was_present | bool
