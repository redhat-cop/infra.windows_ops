---
- name: Test init role
  block:
    - name: Remove test marker file if present
      ansible.windows.win_file:
        path: "{{ windows_manage_init_test_file }}"
        state: absent

    - name: Run initialization
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_init
      vars:
        windows_manage_init_file: "{{ windows_manage_init_test_file }}"
        windows_manage_init_message: "{{ windows_manage_init_test_message }}"
        windows_manage_init_final_actions: []

    - name: Verify marker file exists
      ansible.windows.win_stat:
        path: "{{ windows_manage_init_test_file }}"
      register: windows_manage_init_test_stat

    - name: Assert marker file was created
      ansible.builtin.assert:
        that:
          - windows_manage_init_test_stat.stat.exists
        fail_msg: "Init marker file was not created"

    - name: Run role again for idempotency
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_init
      vars:
        windows_manage_init_file: "{{ windows_manage_init_test_file }}"
        windows_manage_init_message: "{{ windows_manage_init_test_message }}"
        windows_manage_init_final_actions: []

  always:
    - name: Cleanup test marker file
      ansible.windows.win_file:
        path: "{{ windows_manage_init_test_file }}"
        state: absent
