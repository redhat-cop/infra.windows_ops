---
- name: Test system description configuration
  block:
    - name: Capture current description
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $Ansible.Result = (Get-CimInstance -ClassName Win32_OperatingSystem).Description
      register: windows_manage_description_original

    - name: Set system description
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_description
      vars:
        windows_manage_description_text: "{{ windows_manage_description_test_text }}"

    - name: Verify description was set
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $Ansible.Result = (Get-CimInstance -ClassName Win32_OperatingSystem).Description
      register: windows_manage_description_verify

    - name: Assert description value
      ansible.builtin.assert:
        that:
          - windows_manage_description_verify.result == windows_manage_description_test_text
        fail_msg: "System description was not set correctly"

    - name: Run role again to verify idempotency
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_description
      vars:
        windows_manage_description_text: "{{ windows_manage_description_test_text }}"

  always:
    - name: Restore original description
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_description
      vars:
        windows_manage_description_text: "{{ windows_manage_description_original.result | default('', true) }}"
