---
- name: Test recovery environment management
  block:
    - name: Check current recovery status
      ansible.windows.win_command: ReAgentc.exe /info
      changed_when: false
      register: windows_manage_recovery_test_initial

    - name: Record whether recovery was initially enabled
      ansible.builtin.set_fact:
        windows_manage_recovery_test_was_enabled: "{{ 'Enabled' in windows_manage_recovery_test_initial.stdout }}"

    - name: Disable recovery environment
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_recovery
      vars:
        windows_manage_recovery_enable: false

    - name: Verify recovery is disabled
      ansible.windows.win_command: ReAgentc.exe /info
      changed_when: false
      register: windows_manage_recovery_test_verify_disabled

    - name: Assert recovery is disabled
      ansible.builtin.assert:
        that:
          - "'Disabled' in windows_manage_recovery_test_verify_disabled.stdout"
        fail_msg: "Recovery environment was not disabled"

    - name: Run disable again for idempotency
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_recovery
      vars:
        windows_manage_recovery_enable: false

  always:
    - name: Restore recovery to original state if it was enabled
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_recovery
      vars:
        windows_manage_recovery_enable: true
      when: windows_manage_recovery_test_was_enabled | default(false) | bool
