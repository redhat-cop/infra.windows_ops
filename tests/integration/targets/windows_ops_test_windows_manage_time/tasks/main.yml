---
- name: Test time configuration
  block:
    - name: Capture current timezone
      ansible.windows.setup:
        gather_subset:
          - min
      register: windows_manage_time_facts

    - name: Record original timezone
      ansible.builtin.set_fact:
        windows_manage_time_original_tz: "{{ windows_manage_time_facts.ansible_facts.ansible_date_time.tz }}"

    - name: Capture current NTP server
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters
        name: NtpServer
      register: windows_manage_time_original_ntp

    - name: Set timezone to Eastern Standard Time
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_time
      vars:
        windows_manage_time_ntp_servers: "{{ windows_manage_time_test_ntp_servers }}"
        windows_manage_time_timezone: "Eastern Standard Time"
        windows_manage_time_reboot: false

    - name: Gather facts to verify timezone changed
      ansible.windows.setup:
        gather_subset:
          - min
      register: windows_manage_time_verify_est

    - name: Assert timezone is Eastern Standard Time
      ansible.builtin.assert:
        that:
          - windows_manage_time_verify_est.ansible_facts.ansible_date_time.tz == "Eastern Standard Time"
        fail_msg: "Timezone was not changed to Eastern Standard Time"

    - name: Set timezone to UTC
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_time
      vars:
        windows_manage_time_ntp_servers: "{{ windows_manage_time_test_ntp_servers }}"
        windows_manage_time_timezone: "{{ windows_manage_time_test_timezone }}"
        windows_manage_time_reboot: false

    - name: Gather facts to verify timezone changed to UTC
      ansible.windows.setup:
        gather_subset:
          - min
      register: windows_manage_time_verify_utc

    - name: Assert timezone is UTC
      ansible.builtin.assert:
        that:
          - windows_manage_time_verify_utc.ansible_facts.ansible_date_time.tz == windows_manage_time_test_timezone
        fail_msg: "Timezone was not changed to UTC"

    - name: Run role again for idempotency
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_time
      vars:
        windows_manage_time_ntp_servers: "{{ windows_manage_time_test_ntp_servers }}"
        windows_manage_time_timezone: "{{ windows_manage_time_test_timezone }}"
        windows_manage_time_reboot: false

  always:
    - name: Restore original timezone
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_time
      vars:
        windows_manage_time_ntp_servers: "{{ windows_manage_time_test_ntp_servers }}"
        windows_manage_time_timezone: "{{ windows_manage_time_original_tz }}"
        windows_manage_time_reboot: false
