  1.2.0:
    changes:
      major_changes:
      - 'windows_manage_cis - Added new role for CIS Microsoft Windows Server 2022
        Benchmark v1.0.0 compliance automation.

        Supports Level 1 and Level 2 profiles with 96+ security controls across password
        policies, account lockout,

        user rights assignment, security options, audit policies, Windows Firewall,
        and system services.

        Includes check mode for drift detection and comprehensive JSON/HTML reporting.

        '
      - 'windows_manage_stig - Added new role for DISA STIG Windows Server 2022 V1R3
        compliance automation.

        Implements government security standards with 60+ STIG controls covering password
        policies, account lockout,

        audit policies, user rights, registry settings, and system services, and enterprise
        metadata tracking with JSON/HTML reporting.

        '
    fragments:
    - add_windows_manage_cis_role.yml
    - add_windows_manage_stig_role.yml
    release_date: '2026-01-20'
  2.0.0:
    changes:
      bugfixes:
      - windows_manage_stig - Fixed 6 STIG controls that were incorrectly classified
        as CAT II instead of CAT I per official DISA documentation.
      - windows_manage_stig - Fixed ``windows_manage_stig_only_rules`` filtering to
        properly restrict rule execution to only specified STIG IDs.
      - windows_manage_stig - Fixed audit policy remediation to preserve paired success/failure
        controls, preventing "whack-a-mole" effect where fixing one control inadvertently
        breaks its paired control.
      - windows_manage_stig - Fixed critical V-ID to registry mapping errors affecting
        33 controls in registry_settings.yml. Controls were mapping to completely
        wrong registry paths and value names, causing remediation to appear successful
        while DISA SCC scans continued to fail. All mappings verified against official
        DISA STIG V2R7 XCCDF (https://github.com/redhat-cop/infra.windows_ops/issues/41).
      major_changes:
      - windows_manage_cis - Added Windows Server 2025 support with CIS Benchmark
        v1.0.0 (210 controls). Implements version-specific controls including Azure
        Arc integration (18.10.89.1), Zero Trust network access (19.7.1), and AD 32k
        page support (18.10.90.1). Maintains backward compatibility with Windows Server
        2019 and 2022 through automatic version detection.
      - windows_manage_stig - Added Windows Server 2025 support with DISA STIG V1R1
        (295 controls). Implements automatic OS version detection with dual method
        (ProductName + build number fallback). Includes 2025-specific features (Hotpatching
        with Azure Arc, Next-Gen Credential Guard, AD 32k pages) and 2022+ features
        (DNS-over-HTTPS, SMB over QUIC, TLS 1.3). Supports unified role architecture
        across Windows Server 2019 (V3R7), 2022 (V2R7), and 2025 (V1R1) with version-conditional
        logic.
      - windows_manage_stig - Updated to DISA STIG Version 2 Release 7 (V2R7) released
        January 23, 2026. This major update adds 79 new security controls and removes
        1 deprecated rule (V-254411) (total 283 rules, up from 205), and significantly
        expands audit policies coverage with 34 new audit configuration rules. The
        update maintains backward compatibility with existing variables while introducing
        enhanced compliance coverage across all STIG categories.
      minor_changes:
      - windows_manage_cis - Added version-specific feature detection for DNS-over-HTTPS
        and TLS 1.3 on Windows Server 2022+.
      - windows_manage_stig - Added integration tests for ``windows_manage_stig_only_rules``
        filtering functionality.
      - windows_manage_stig - Created integration tests for version detection validation
        and Windows Server 2025 feature verification.
      - windows_manage_stig - Enhanced compliance reporting with version detection
        metadata including detected_version, benchmark_version, and version_features
        in JSON reports.
      - windows_manage_stig - Updated security_options.yml with version-aware LAPS
        implementation (MSI for 2019, native for 2022/2025) and SMB signing behavior
        (enforce for 2019/2022, verify-only for 2025 with default enabled).
      release_summary: Updated Windows compliance to DISA STIG V2R7 (2022) and V1R1
        (2025) with critical fixes for 33 V-ID mapping errors, 6 severity classifications,
        and audit policy paired controls.
    fragments:
    - ACA-4989-add-integration-tests.yml
    - ACA-4989-fix-stig-only-rules-filtering.yml
    - ACA-4990-update-stig-v2r7.yml
    - ACA-4993-add-windows-2025-support.yml
    - issue-36-fix-stig-severity-mismatch.yml
    - issue-37-fix-audit-policy-paired-controls.yml
    - issue-41-fix-stig-v-id-mapping-errors.yml
    release_date: '2026-02-09'
  2.0.1:
    changes:
      bugfixes:
      - windows_manage_cis - Fixed role failure in check mode by ensuring all informational
        audit tasks run even when check mode is enabled.
      - windows_manage_cis - Removed custom `windows_manage_cis_check_mode` variable
        to ensure role consistently respects standard Ansible playbook check mode
        (`--check`).
      - windows_manage_stig - Fixed V-ID collisions and ensured data integrity across
        benchmark versions.
      - windows_manage_stig - Fixed a bug in Windows Server 2022 STIG tasks where
        the system services audit loop referenced an incorrect variable name, causing
        task failure.
      - windows_manage_stig - Fixed compliance reporting logic for Audit Policies
        to accept over-compliance (e.g., 'Success and Failure' for a 'Failure' requirement).
      - windows_manage_stig - Fixed compliance scoring logic to correctly mark remediated
        controls as 'PASS' when changes are successfully applied, ensuring the final
        compliance score reflects the post-remediation state.
      - windows_manage_stig - Fixed issue where `windows_manage_stig_only_rules` was
        ignored by audit and remediation tasks, causing all controls to be processed.
        Now only specified controls are audited and remediated.
      - windows_manage_stig - Fixed issue where manual controls were being displayed
        even when `windows_manage_stig_only_rules` was set to exclude them. Now manual
        controls respect both `only_rules` and `skip_rules` filters.
      - windows_manage_stig - Fixed role failure in check mode by ensuring all informational
        audit tasks run even when check mode is enabled.
      - windows_manage_stig - Fixed various user rights and service configuration
        errors in 2019 and 2022 benchmarks.
      - windows_manage_stig - Moved connection-breaking controls (LAN Manager Auth,
        Machine Lockout) to manual documentation to prevent remote admin lockout.
      - windows_manage_stig - Removed unused templates referencing deprecated `windows_manage_stig_check_mode`
        variable.
      major_changes:
      - windows_manage_stig - Added advanced features support including DNS-over-HTTPS
        (DoH), SMB QUIC, TLS 1.3, and Hotpatching.
      - windows_manage_stig - Implemented 100% DISA STIG coverage for Windows Server
        2019, 2022, and 2025 with accurate V-ID mapping for each platform.
      - windows_manage_stig - Improved compliance reporting with detailed execution
        summaries, manual control action items, and failed control breakdowns.
      - windows_manage_stig - Refactored role into version-isolated task directories
        (2019/, 2022/, 2025/) to support Windows Server 2019, 2022, and 2025 benchmarks.
      minor_changes:
      - 'windows_manage_cis - Added support for generating compliance reports during
        check mode execution. Controlled by `windows_manage_cis_report_in_check_mode`
        (default: true).'
      - 'windows_manage_stig - Added support for generating compliance reports during
        check mode execution. Controlled by `windows_manage_stig_report_in_check_mode`
        (default: true).'
    fragments:
    - feat_report_in_check_mode_52.yml
    - fix_check_mode_consistency_51.yml
    - fix_check_mode_failures_47.yml
    - fix_compliance_scoring_49.yml
    - fix_manual_controls_filtering.yml
    - fix_only_rules_filtering_48.yml
    - fix_stig_services_loop_ref_46.yml
    - version_separation_refactor.yml
    release_date: '2026-03-08'
  2.1.0:
    changes:
      bugfixes:
      - infra.windows_ops - exclude local development files from the built collection
        artifact. ``ansible-galaxy collection build`` does not read ``.gitignore``,
        so a build run from a working tree that contained them packaged the integration
        test inventory (``tests/integration/inventory.winrm``), a local ``.venv``
        virtual environment, ``docs/plans``, and assistant configuration into the
        published tarball. These are now listed in ``build_ignore`` (https://github.com/redhat-cop/infra.windows_ops/pull/113).
      - windows_manage_updates - honor the documented ``windows_manage_updates_reboot``
        toggle when deciding whether to reboot after installing updates; the role
        previously gated the reboot on an undefined ``windows_manage_updates_reboot_server``
        variable, so the documented control had no effect (https://github.com/redhat-cop/infra.windows_ops/pull/105).
      minor_changes:
      - windows_manage_accounts - new role for managing local Windows user accounts,
        groups, group memberships, user rights, and profiles (https://github.com/redhat-cop/infra.windows_ops/pull/81).
      - windows_manage_audit - new role for managing Windows audit policies and audit
        rules with system-wide policy configuration and path-specific rule management
        (https://github.com/redhat-cop/infra.windows_ops/pull/77).
      - windows_manage_boot - new role for configuring Windows Boot Manager settings
        such as the boot menu timeout (https://github.com/redhat-cop/infra.windows_ops/pull/95).
      - windows_manage_capabilities - new role for installing and removing Windows
        capabilities (Features on Demand) via DISM (https://github.com/redhat-cop/infra.windows_ops/pull/93).
      - windows_manage_description - new role for configuring Windows system description,
        organization, and owner.
      - windows_manage_disk_cleanup - new role for reclaiming disk space by cleaning
        superseded Windows Update component files and clearing event logs (https://github.com/redhat-cop/infra.windows_ops/pull/96).
      - windows_manage_dns_client - new role for configuring Windows DNS client settings
        including DNS servers and suffix search lists per network adapter (https://github.com/redhat-cop/infra.windows_ops/pull/70).
      - windows_manage_dotnet - new role for optimizing .NET native images (ngen)
        for PowerShell and installed assemblies (https://github.com/redhat-cop/infra.windows_ops/pull/94).
      - windows_manage_dsc - new role for applying Windows PowerShell DSC resource
        configurations with optional reboot handling (https://github.com/redhat-cop/infra.windows_ops/pull/100).
      - windows_manage_dsc3 - new role to apply Windows DSC v3 configurations with
        ``ansible.windows.dsc3``, including optional reboot handling (https://github.com/redhat-cop/infra.windows_ops/pull/103).
      - windows_manage_environment - new role for managing Windows environment variables
        and PATH settings (https://github.com/redhat-cop/infra.windows_ops/pull/99).
      - windows_manage_features - new role for installing and removing Windows Server
        roles and features (https://github.com/redhat-cop/infra.windows_ops/pull/91).
      - windows_manage_file_acl - new role to manage Windows file and directory ACLs,
        ownership, and ACL inheritance (https://github.com/redhat-cop/infra.windows_ops/pull/84).
      - windows_manage_file_copy - new role to copy files and render templates to
        Windows hosts, optionally setting the destination path owner (https://github.com/redhat-cop/infra.windows_ops/pull/85).
      - windows_manage_file_create - new role for creating directories and files and
        setting path ownership on Windows hosts (https://github.com/redhat-cop/infra.windows_ops/pull/86).
      - windows_manage_file_fetch - new role to fetch files from remote Windows hosts
        to the Ansible controller (https://github.com/redhat-cop/infra.windows_ops/pull/87).
      - windows_manage_file_get - new role to download files to Windows hosts over
        HTTP/HTTPS with optional ownership (https://github.com/redhat-cop/infra.windows_ops/pull/88).
      - windows_manage_file_remove - new role for removing files and directories on
        Windows with wildcard and exclusion support (https://github.com/redhat-cop/infra.windows_ops/pull/89).
      - windows_manage_firewall - new role for managing Windows firewall profiles
        and rules with enable/disable support and skip-on-conflict safety logic (https://github.com/redhat-cop/infra.windows_ops/pull/76).
      - windows_manage_hostname - new role for configuring Windows system hostname
        with validation and optional reboot (https://github.com/redhat-cop/infra.windows_ops/pull/60).
      - windows_manage_hosts_file - new role for managing Windows hosts file entries
        with optional self-entry and IPv4/IPv6 filtering (https://github.com/redhat-cop/infra.windows_ops/pull/72).
      - windows_manage_init - new role for one-time Windows system initialization.
      - windows_manage_locale - new role for configuring Windows locale, language,
        and input settings.
      - windows_manage_network - new role for configuring Windows network settings
        including IPv6, NetBIOS, LMHOSTS lookup, and static routes (https://github.com/redhat-cop/infra.windows_ops/pull/71).
      - windows_manage_optional_features - new role for installing and removing Windows
        optional features via DISM, with optional reboot handling (https://github.com/redhat-cop/infra.windows_ops/pull/92).
      - windows_manage_packages - new role to install and remove Windows software
        packages (MSI/EXE/MSIX) with ``ansible.windows.win_package``, including optional
        reboot handling (https://github.com/redhat-cop/infra.windows_ops/pull/102).
      - windows_manage_performance - new role for applying Windows performance tuning
        settings, including NTFS last access time, page file, power scheme, and hibernation
        (https://github.com/redhat-cop/infra.windows_ops/pull/97).
      - windows_manage_rdp - new role for enabling or disabling Remote Desktop Protocol
        with firewall and authentication settings (https://github.com/redhat-cop/infra.windows_ops/pull/73).
      - windows_manage_reboot - new role for rebooting Windows systems with configurable
        delays and timeout.
      - windows_manage_recovery - new role for managing Windows Recovery Environment
        (WinRE).
      - windows_manage_registry - new role to apply system-wide Windows registry settings
        with ``ansible.windows.win_regedit``, including optional per-setting reboot
        handling (https://github.com/redhat-cop/infra.windows_ops/pull/90).
      - windows_manage_scheduled_tasks - new role for creating, enabling, disabling,
        and removing Windows scheduled tasks (https://github.com/redhat-cop/infra.windows_ops/pull/98).
      - windows_manage_service - add support for creating and reconfiguring services
        (binary path, display name, description, dependencies, run-as account) and
        report service state with ``ansible.windows.win_service_info`` (https://github.com/redhat-cop/infra.windows_ops/pull/104).
      - windows_manage_sshd - new role for managing OpenSSH Server on Windows with
        config validation, admin key management, and disable safety check (https://github.com/redhat-cop/infra.windows_ops/pull/78).
      - windows_manage_time - new role for configuring Windows NTP servers and timezone.
      - windows_manage_updates - add update filtering (accept/reject lists, skip optional),
        a configurable retry loop, reboot timeout control, and optional .NET assembly
        compilation via the windows_manage_dotnet role (https://github.com/redhat-cop/infra.windows_ops/pull/105).
      - windows_manage_user_experience - new role for configuring Windows user experience
        settings such as Server Manager auto-launch, network location wizard, and
        Welcome Screen behavior (https://github.com/redhat-cop/infra.windows_ops/pull/82).
      - windows_manage_user_settings - new role for applying per-user registry settings
        across existing and logged-in Windows user profiles (https://github.com/redhat-cop/infra.windows_ops/pull/83).
      - windows_manage_winrm - new role for configuring Windows Remote Management
        service, listeners, and firewall rules (https://github.com/redhat-cop/infra.windows_ops/pull/74).
      - windows_manage_wsl - new role for installing, configuring, and removing the
        Windows Subsystem for Linux (WSL) and its distributions (https://github.com/redhat-cop/infra.windows_ops/pull/101).
    fragments:
