---
- name: Gather needed facts
  ansible.windows.setup:
    gather_subset:
      - '!all'
      - '!min'
      - platform
  when: ansible_facts.hostname is not defined

- name: Ensure hostname length is valid
  ansible.builtin.assert:
    that:
      - windows_manage_hostname_name | length <= 63
    fail_msg: "Maximum hostname length allowed is 63 characters."

- name: Ensure hostname is valid
  ansible.builtin.assert:
    that:
      - windows_manage_hostname_name | regex_search("[^a-zA-Z0-9-.:]") is none
      - not windows_manage_hostname_name.startswith('-')
      - not windows_manage_hostname_name.startswith('.')
      - not windows_manage_hostname_name.endswith('-')
      - not windows_manage_hostname_name.endswith('.')
    fail_msg: "The provided hostname is invalid."

- name: Configure system hostname
  ansible.windows.win_hostname:
    name: "{{ windows_manage_hostname_name }}"
  register: windows_manage_hostname__result
  when:
    - "':' not in windows_manage_hostname_name"
    - windows_manage_hostname_name != 'localhost.localdomain'
    - windows_manage_hostname_name | regex_search('[a-zA-Z]') is not none

- name: Reboot system
  ansible.windows.win_reboot:
    reboot_timeout: 600
    msg: "Ansible reboot after system hostname change"
  when:
    - windows_manage_hostname_reboot | bool
    - windows_manage_hostname__result.reboot_required
