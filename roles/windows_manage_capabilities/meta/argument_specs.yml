---
argument_specs:
  main:
    version_added: 2.1.0
    short_description: Manage Windows capabilities (Features on Demand).
    description:
      - Install or remove Windows capabilities (Features on Demand / FoD) using DISM.
      - Optionally reboots the host when a capability change requires it.
    options:
      windows_manage_capabilities_install:
        type: list
        elements: raw
        description:
          - Capabilities to install.
          - Each item is either a capability name string, or a mapping with the key
            C(name) and optionally C(source) and C(disable_windows_update).
        default: []
      windows_manage_capabilities_remove:
        type: list
        elements: str
        description:
          - Capability names to remove.
          - Names also present in O(windows_manage_capabilities_install) are skipped.
        default: []
      windows_manage_capabilities_remove_ignore_unknown:
        type: bool
        description:
          - Ignore failures when removing capabilities that are not present or not recognized.
        default: true
      windows_manage_capabilities_reboot:
        type: bool
        description:
          - Reboot the host automatically when a capability change requires it.
        default: true
      windows_manage_capabilities_log_level:
        type: int
        description:
          - DISM logging level.
          - C(0) logs errors only, C(1) errors and warnings, C(2) adds information,
            C(3) adds debug output.
        choices:
          - 0
          - 1
          - 2
          - 3
        default: 1
      windows_manage_capabilities_log_path:
        type: str
        description:
          - Path to the DISM log file.
          - When unset, the default DISM log location is used.
