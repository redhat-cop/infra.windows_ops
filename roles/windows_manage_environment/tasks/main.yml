---
- name: Verify path environment settings format
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name is string
      - item.scope is defined and item.scope is string and item.scope in ['machine', 'user']
      - item.state is defined and item.state is string and item.state in ['absent', 'present']
      - item.elements is defined and (item.elements is string or (item.elements is iterable and item.elements is not mapping))
      - item.elements | length > 0
    fail_msg: |
      Invalid or incomplete path environment setting:

      {{ item | to_nice_yaml }}
    quiet: true
  loop: "{{ windows_manage_environment_paths }}"
  loop_control:
    label: "{{ item.name | default('') }}"

- name: Verify environment variable settings format
  ansible.builtin.assert:
    that:
      - item.level is defined and item.level is string and item.level in ['machine', 'user']
      - item.variables is defined and item.variables is mapping
      - item.variables | length > 0
    fail_msg: |
      Invalid or incomplete environment variable setting:

      {{ item | to_nice_yaml }}
    quiet: true
  loop: "{{ windows_manage_environment_variables }}"
  loop_control:
    label: "{{ item.variables.keys() | default('') }}"

- name: Configure path environment settings
  ansible.windows.win_path:
    scope: "{{ item.scope }}"
    name: "{{ item.name }}"
    elements: "{{ item.elements }}"
    state: "{{ item.state }}"
  register: windows_manage_environment__path_config
  loop: "{{ windows_manage_environment_paths }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure environment variable settings
  ansible.windows.win_environment:
    level: "{{ item.level }}"
    variables: "{{ item.variables }}"
  register: windows_manage_environment__variable_config
  loop: "{{ windows_manage_environment_variables }}"
  loop_control:
    label: "{{ item.variables.keys() }}"

- name: Reboot system after environment changes
  vars:
    windows_manage_environment__path_reboot_needed: "{{ windows_manage_environment__path_config.results
                                                        | selectattr('item.reboot', 'defined')
                                                        | selectattr('item.reboot', 'equalto', true)
                                                        | selectattr('changed', 'equalto', true) | length > 0 }}"
    windows_manage_environment__variable_reboot_needed: "{{ windows_manage_environment__variable_config.results
                                                            | selectattr('item.reboot', 'defined')
                                                            | selectattr('item.reboot', 'equalto', true)
                                                            | selectattr('changed', 'equalto', true) | length > 0 }}"
  ansible.windows.win_reboot:
    reboot_timeout: 600
    msg: "Ansible reboot after environment changes"
  when:
    - windows_manage_environment_reboot | bool
    - windows_manage_environment__path_config is changed or
      windows_manage_environment__variable_config is changed
    - windows_manage_environment__path_reboot_needed or
      windows_manage_environment__variable_reboot_needed
