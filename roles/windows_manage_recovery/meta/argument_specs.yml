---
argument_specs:
  main:
    version_added: 2.1.0
    short_description: Manage Windows Recovery Environment.
    description:
      - Enable or disable Windows Recovery Environment (WinRE).
      - When disabling, removes the C(C:\Recovery) directory.
    options:
      windows_manage_recovery_enable:
        type: bool
        description:
          - Whether to enable or disable Windows Recovery Environment.
          - When set to C(false), also removes C(C:\Recovery) directory.
        default: false
