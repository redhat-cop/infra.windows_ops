---
- name: Ensure WinRM is not being disabled over WinRM
  ansible.builtin.assert:
    that:
      - ansible_connection not in ['winrm', 'psrp']
    fail_msg: "Refusing to disable WinRM when using WinRM."

- name: Check WinRM service
  ansible.windows.win_service_info:
    name: WinRM
  register: windows_manage_winrm__service

- name: Disable WinRM service
  ansible.windows.win_service:
    name: WinRM
    start_mode: disabled
    state: stopped
  when: windows_manage_winrm__service.exists

- name: Block firewall WinRM HTTP port
  community.windows.win_firewall_rule:
    name: Windows Remote Management (HTTP-In)
    state: present
    enabled: true
    action: block
    direction: in
    localport: 5985
    protocol: tcp
    profiles: "{{ windows_manage_winrm_firewall_profiles | default(omit) }}"

- name: Block firewall WinRM HTTPS port
  community.windows.win_firewall_rule:
    name: Windows Remote Management (HTTPS-In)
    state: present
    enabled: true
    action: block
    direction: in
    localport: 5986
    protocol: tcp
    profiles: "{{ windows_manage_winrm_firewall_profiles | default(omit) }}"
