---
- name: Fail if trying to disable sshd using SSH
  ansible.builtin.fail:
    msg: "Refusing to disable sshd when using SSH."
  when: ansible_connection == 'ssh'

- name: Check sshd service
  ansible.windows.win_service_info:
    name: sshd
  register: windows_manage_sshd_service

- name: Disable sshd service
  ansible.windows.win_service:
    name: sshd
    start_mode: disabled
    state: stopped
  when: windows_manage_sshd_service.exists

- name: Block firewall SSH port
  community.windows.win_firewall_rule:
    name: OpenSSH SSH Server (sshd)
    state: present
    enabled: true
    action: block
    direction: in
    localport: 22
    protocol: tcp
    profiles: "{{ windows_manage_sshd_firewall_profiles | default(omit, true) }}"
