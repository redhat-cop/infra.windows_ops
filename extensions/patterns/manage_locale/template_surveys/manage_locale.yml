---
name: "Manage Locale Configuration Survey"
description: "Survey to configure Windows locale and language settings"
spec:
  - type: "text"
    question_name: "System Locale"
    question_description: "System locale affecting non-Unicode programs (e.g., en-US)"
    variable: "locale_system"
    required: true
    default: "en-US"

  - type: "text"
    question_name: "UI Language"
    question_description: "UI display language (e.g., en-US)"
    variable: "locale_ui"
    required: true
    default: "en-US"

  - type: "text"
    question_name: "User Locale"
    question_description: "User locale for date, time, and number formats (e.g., en-US)"
    variable: "locale_user"
    required: true
    default: "en-US"

  - type: "multiplechoice"
    question_name: "Reboot After Change"
    question_description: "Whether to reboot after locale changes"
    variable: "locale_reboot"
    required: true
    default: "true"
    choices:
      - "true"
      - "false"
