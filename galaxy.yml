---
namespace: infra
name: windows_ops
version: 2.0.1
authors:
  - Ansible (https://github.com/ansible)
description: A collection of content (roles, playbooks, etc) for Ansible Automation Platform on Windows. Includes infrastructure management, IIS web server management, service management, Windows updates, and security compliance automation (CIS benchmarks and DISA STIG).
documentation: ''
homepage: https://github.com/redhat-cop/infra.windows_ops
issues: https://github.com/redhat-cop/infra.windows_ops/issues
license_file: LICENSE
readme: README.md
repository: https://github.com/redhat-cop/infra.windows_ops
tags:
  - windows
  - infrastructure
  - security
  - compliance
  - hardening
dependencies:
  ansible.windows: '>=3.6.0'
  microsoft.iis: '>=1.0.2'
  community.windows: '>=3.0.0'
# Patterns are fnmatch-matched against each entry's path relative to the
# collection root, so nested paths must be spelled out in full. Everything
# excluded by .gitignore is repeated here: the collection build does not read
# .gitignore, so untracked local files would otherwise be published.
build_ignore:
  - '.tox'
  - '.git'
  - '.github'
  - '.gitignore'
  - '.yamllint'
  - '.config'
  - '.ansible'
  - '.venv'
  - '.claude*'
  - 'CLAUDE.md'
  - 'docs/plans'
  - 'generate_inventory'
  - 'inventory.winrm*'
  - 'tests/integration/inventory.winrm*'
  - 'STIG_CONTROLS_*.md'
